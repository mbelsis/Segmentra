# Native firewall manager (firewalld / ufw), part 1 (prepare play of apply-firewall.yml, all hosts):
# backup, reload-safety validation and policy upload. Nothing is enforced yet.
- name: Ensure native-manager backup directory exists
  become: true
  file:
    path: "{{ segmentra_backup_dir }}"
    state: directory
    mode: "0700"

- name: Install one-shot native-manager helper
  become: true
  copy:
    src: "{{ segmentra_manager_script }}"
    dest: "{{ segmentra_backup_dir }}/segmentra-manager.py"
    mode: "0700"

- name: Generate native-manager deployment identifier
  set_fact:
    manager_run: "{{ lookup('pipe', 'date +%s') }}-{{ 100000000 | random }}"

- name: Define native-manager rollback paths
  set_fact:
    manager_backup: "{{ segmentra_backup_dir }}/{{ segmentra_backend }}.{{ manager_run }}.json"
    manager_marker: "{{ segmentra_backup_dir }}/manager-revert.{{ manager_run }}"
    manager_unit: "segmentra-manager-revert-{{ manager_run }}"

- name: Back up native permanent configuration and validate reload safety
  become: true
  command:
    argv: [python3, "{{ segmentra_backup_dir }}/segmentra-manager.py", "{{ segmentra_backend }}", backup, "{{ manager_backup }}"]

- name: Copy native-manager policy to host
  become: true
  copy:
    src: "{{ seg_policy_file }}"
    dest: /etc/segmentra.policy
    mode: "0600"

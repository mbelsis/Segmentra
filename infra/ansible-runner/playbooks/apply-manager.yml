# Native firewall manager (firewalld / ufw), part 2 (lockout-protected apply play of apply-firewall.yml,
# run in `serial` batches so the 180 s rollback window does not depend on the fleet size). Never fails the
# host here: failures are recorded in seg_apply_failed_msg and reported by the last play (in serial mode a
# batch whose hosts all fail would end the whole playbook). Part 1: apply-manager-prepare.yml.
# The rollback lives in a file: systemd 252 (RHEL 9, Debian 12) corrupts an inline "sh -c" command when its transient
# unit is re-read, and applying the policy runs "systemctl enable", which reloads systemd.
- name: Write the unattended rollback script
  become: true
  copy:
    dest: "{{ manager_marker }}.sh"
    mode: '0700'
    content: |
      touch {{ manager_marker | quote }}
      python3 {{ (segmentra_backup_dir ~ '/segmentra-manager.py') | quote }} {{ segmentra_backend | quote }} restore {{ manager_backup | quote }}

- name: Schedule unattended rollback before changing the native firewall
  become: true
  shell: >-
    systemd-run --quiet --unit={{ manager_unit | quote }} --on-active=180
    --timer-property=AccuracySec=1s /bin/sh {{ (manager_marker ~ '.sh') | quote }}
  register: manager_sched
  failed_when: false

- name: Record that the native-manager rollback could not be scheduled (nothing was changed)
  when: manager_sched.rc | default(1) != 0
  set_fact:
    seg_apply_failed_msg: "Could not schedule the unattended rollback (lockout protection); deployment aborted, no changes made: {{ manager_sched.stderr | default(manager_sched.msg | default('')) }}"

- name: Stop here when the native-manager rollback could not be scheduled
  when: manager_sched.rc | default(1) != 0
  meta: end_host

- name: Apply and verify native firewall policy
  block:
    - name: Apply permanent native rules and enable the firewall boot service
      become: true
      command:
        argv: [python3, "{{ segmentra_backup_dir }}/segmentra-manager.py", "{{ segmentra_backend }}", apply, /etc/segmentra.policy]

    - name: Close the pre-apply SSH connection
      meta: reset_connection

    - name: Verify a fresh SSH connection through the new policy
      wait_for_connection:
        timeout: 30
        connect_timeout: 5

    - name: Verify reboot persistence before cancelling rollback
      become: true
      command:
        argv: [python3, "{{ segmentra_backup_dir }}/segmentra-manager.py", "{{ segmentra_backend }}", persist]
      changed_when: false

    - name: Cancel rollback only if it has not already fired
      become: true
      shell: |
        test ! -e {{ manager_marker | quote }} || exit 9
        systemctl stop {{ (manager_unit ~ '.timer') | quote }} || { test ! -e {{ manager_marker | quote }} || exit 9; exit 1; }
        # Stopping the timer does not stop a .service it already started (the restore is running).
        case "$(systemctl is-active {{ (manager_unit ~ '.service') | quote }} 2>/dev/null)" in active|activating|deactivating|reloading|refreshing) exit 9 ;; esac
        test ! -e {{ manager_marker | quote }} || exit 9
  rescue:
    - name: Restore the previous permanent policy and native runtime
      become: true
      ignore_unreachable: true
      command:
        argv: [python3, "{{ segmentra_backup_dir }}/segmentra-manager.py", "{{ segmentra_backend }}", restore, "{{ manager_backup }}"]
      register: manager_restore
      failed_when: false

    - name: Stop pending rollback after a successful immediate restore
      become: true
      ignore_unreachable: true
      command:
        argv: [systemctl, stop, "{{ manager_unit }}.timer"]
      when: manager_restore.rc | default(-1) == 0
      failed_when: false

    - name: Record native-manager deployment failure (reported by the last play)
      set_fact:
        seg_apply_failed_msg: "Native firewall apply or persistence verification failed; restore {{ ('exit code ' ~ manager_restore.rc) if manager_restore.rc is defined else 'not run (host unreachable)' }}. The unattended rollback remains scheduled if restore failed."

- name: Finish this host after native-manager deployment
  meta: end_host

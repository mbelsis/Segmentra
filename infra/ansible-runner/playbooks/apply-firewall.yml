# Three plays (facts set with set_fact carry over from play to play):
#   1. prepare (all hosts at once): checks, backups, policy upload, host scripts. Nothing enforced yet.
#   2. apply with lockout protection, `serial` batches of `forks` hosts: arm the unattended revert ->
#      apply -> verify a fresh SSH connection -> cancel -> persist. With the default linear strategy every
#      task runs on ALL hosts of the play before the next task starts, so in one big play the time between
#      arming and cancelling grows with the fleet (ceil(hosts / forks) rounds per task): on ~50+ hosts the
#      first hosts' revert fired before their cancel ran and rolled back correct policies. In batches the
#      window is a handful of tasks for at most `forks` hosts, whatever the fleet size. (strategy: free does
#      not help: it round-robins over all hosts as well.) A batch whose hosts ALL fail ends the whole
#      playbook in serial mode, so this play never fails a host on purpose: failures are recorded in
#      seg_apply_failed_msg and reported by play 3. (Only hosts that become unreachable during the apply
#      itself fail here; a batch of only such hosts stops the rollout.)
#   3. report (all hosts): fail every host with a recorded failure.
- name: Segmentra apply firewall rules (prepare)
  hosts: all
  gather_facts: false
  any_errors_fatal: false
  vars: &segmentra_vars
    segmentra_backup_dir: "/var/backups/segmentra"
    # Inputs (inventory host vars, or environment as fallback). Play vars must not redefine
    # them (play vars take precedence over inventory vars, and a self-reference recurses):
    #   segmentra_policy_file      compiled policy (.nft or .iptables)
    #   segmentra_ip6_policy_file  optional, iptables backend: ip6tables-restore --noflush fragment
    #                              (CompileOutput.ip6tablesRules)
    seg_policy_file: "{{ segmentra_policy_file | default(lookup('env', 'SEGMENTRA_POLICY_FILE'), true) | default('', true) }}"
    seg_ip6_policy_file: "{{ segmentra_ip6_policy_file | default(lookup('env', 'SEGMENTRA_IP6_POLICY_FILE'), true) | default('', true) }}"
    segmentra_legacy_policy: "/etc/segmentra.legacy.policy"
    segmentra_legacy_policy6: "/etc/segmentra.legacy.policy6"
    # Seconds until the unattended revert (lockout protection) fires; input segmentra_rollback_timeout (min 30).
    seg_revert_delay: "{{ [30, (segmentra_rollback_timeout | default(120, true)) | int] | max }}"
    seg_revert_unit: "segmentra-revert-{{ segmentra_ts | default('') | regex_replace('[^0-9A-Za-z]', '') }}"
    seg_revert_marker: "{{ segmentra_backup_dir }}/revert-fired.{{ segmentra_ts | default('') }}"

  # Segmentra only ever touches its own state:
  #   nftables: table inet segmentra (replaced atomically by nft -f)
  #   iptables: chains SEGMENTRA-IN / SEGMENTRA-OUT plus one jump from INPUT / OUTPUT, and on
  #             gateways filtering forwarded traffic SEGMENTRA-FWD plus one jump from FORWARD
  #             (iptables-restore --noflush; see files/segmentra-iptables.sh)
  # Docker, Kubernetes, fail2ban, ... rules and built-in chain policies are left alone.
  # Backups and the failure rollback are scoped to exactly that state as well
  # (files/segmentra-nft.sh, files/segmentra-iptables.sh "backup" / "restore"): a full
  # `nft list ruleset` cannot be replayed on hosts where other tools use iptables-nft
  # (xtables-compat expressions), and replaying it would clobber their tables anyway.

  tasks:
    - name: Prepare the deployment through the native firewall manager
      include_tasks: apply-manager-prepare.yml
      when: (segmentra_backend | default('')) in ['firewalld', 'ufw']

    - name: Native firewall manager hosts continue in the apply play
      meta: end_host
      when: (segmentra_backend | default('')) in ['firewalld', 'ufw']

    # Random suffix: two runs within the same second must never share backup files or revert units.
    - name: Generate timestamp
      set_fact:
        segmentra_ts: "{{ lookup('pipe', 'date +%Y-%m-%dT%H-%M-%S') }}-{{ '%08x' | format(4294967295 | random) }}"

    - name: Fail if policy file not provided
      fail:
        msg: "SEGMENTRA_POLICY_FILE is required"
      when: seg_policy_file == ""

    - name: Ensure backup directory exists
      become: true
      file:
        path: "{{ segmentra_backup_dir }}"
        state: directory
        mode: "0700"

    # Both tools may be installed (iptables-nft ships next to nft on modern distros), so only
    # check that the tool required by the compiled policy exists.
    - name: Detect nftables
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v nft >/dev/null 2>&1 && echo nft || echo no"
      register: nft_detect
      changed_when: false

    - name: Detect iptables-restore
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v iptables-restore >/dev/null 2>&1 && echo iptables || echo no"
      register: ipt_detect
      changed_when: false

    - name: Decide backend
      set_fact:
        nft_will_apply: "{{ nft_detect.stdout == 'nft' and seg_policy_file.endswith('.nft') }}"
        iptables_will_apply: "{{ ipt_detect.stdout == 'iptables' and seg_policy_file.endswith('.iptables') }}"
        ip6_will_apply: "{{ ipt_detect.stdout == 'iptables' and seg_policy_file.endswith('.iptables') and seg_ip6_policy_file != '' }}"

    - name: Log backend detection vs policy file
      debug:
        msg: "Backend detection: nft={{ nft_detect.stdout }} iptables-restore={{ ipt_detect.stdout }}, Policy file: {{ seg_policy_file }}, IPv6 policy file: {{ seg_ip6_policy_file | default('', true) }}, Will apply nftables: {{ nft_will_apply }}, Will apply iptables: {{ iptables_will_apply }}"

    - name: Fail if backend mismatch detected (no apply task will run)
      fail:
        msg: "The tool required by the policy is not installed on the host (policy file: {{ seg_policy_file }}; nft: {{ nft_detect.stdout }}, iptables-restore: {{ ipt_detect.stdout }}). Install it or change the host's firewall_backend setting."
      when: not nft_will_apply and not iptables_will_apply

    # Same check as packages/executor/src/backend-conflict.ts: refuse while Segmentra rules of ANOTHER backend are
    # still active (the host's backend was changed in the inventory). Both would be enforced, and the old default-deny
    # would keep dropping traffic the new policy allows. Nothing has been changed on the host yet.
    - name: Check for Segmentra rules of another firewall backend
      become: true
      shell: |
        PATH="$PATH:/usr/sbin:/sbin"
        target={{ 'nftables' if nft_will_apply else 'iptables' }}
        found=""
        if [ "$target" != nftables ] && command -v nft >/dev/null 2>&1 && nft list table inet segmentra >/dev/null 2>&1; then
          found="$found nftables(table inet segmentra)"
        fi
        for t in iptables-save ip6tables-save; do
          command -v "$t" >/dev/null 2>&1 || continue
          out=$("$t" 2>/dev/null) || continue
          if [ "$target" != iptables ] && printf '%s\n' "$out" | grep -Eq -- '^-A (INPUT|OUTPUT|FORWARD|DOCKER-USER) (.* )?-j SEGMENTRA-'; then
            case "$found" in *"iptables($t)"*) ;; *) found="$found iptables($t)";; esac
          fi
          if printf '%s\n' "$out" | grep -Eq -- '^-A ufw6?-before-(input|output) -j SEGMENTRA-'; then
            case "$found" in *ufw*) ;; *) found="$found ufw";; esac
          fi
        done
        if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1 && firewall-cmd --info-policy=segmentra-in >/dev/null 2>&1; then
          found="$found firewalld(policy segmentra-in)"
        fi
        if [ -n "$found" ]; then echo "segmentra-backend-conflict:$found"; exit 3; fi
        echo "segmentra-backend-conflict: none"
      register: backend_conflict
      changed_when: false
      failed_when: false

    - name: Fail if another backend's Segmentra rules are still active
      fail:
        msg: "Segmentra rules from another firewall backend are still active on this host ({{ backend_conflict.stdout | regex_replace('^segmentra-backend-conflict:\\s*', '') }}) while this deployment targets {{ 'nftables' if nft_will_apply else 'iptables' }}. Remove the previous backend's Segmentra rules first (Inventory -> host -> Remove previous backend rules, or POST /api/hosts/:id/firewall/remove-backend-rules), then deploy again."
      when: backend_conflict.rc == 3

    - name: Fail if the backend conflict check could not run
      fail:
        msg: "Could not check for Segmentra rules of another firewall backend (exit {{ backend_conflict.rc }}): {{ backend_conflict.stderr | default('') }}"
      when: backend_conflict.rc not in [0, 3]

    - name: Backup nftables.conf
      when: nft_will_apply
      become: true
      shell: |
        umask 077
        if [ -f /etc/nftables.conf ]; then
          cp /etc/nftables.conf "{{ segmentra_backup_dir }}/nftables.conf.{{ segmentra_ts }}"
        fi
      changed_when: true

    # Scoped backup: table inet segmentra only ("absent" marker if it does not exist).
    - name: Backup table inet segmentra
      when: nft_will_apply
      become: true
      script: "files/segmentra-nft.sh backup {{ segmentra_backup_dir }}/nft.ruleset.{{ segmentra_ts }}"
      changed_when: true

    # Scoped backup: SEGMENTRA-IN/OUT(/FWD) + INPUT/OUTPUT(/FORWARD) jumps (+ legacy-host flag);
    # the full iptables-save is kept next to it as <file>.full.
    - name: Backup iptables SEGMENTRA chains
      when: iptables_will_apply
      become: true
      script: "files/segmentra-iptables.sh backup iptables {{ segmentra_backup_dir }}/iptables.{{ segmentra_ts }}"
      changed_when: true

    - name: Detect ip6tables-save / ip6tables-restore
      when: iptables_will_apply
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v ip6tables-save >/dev/null 2>&1 && command -v ip6tables-restore >/dev/null 2>&1 && echo yes || echo no"
      register: ip6_tools_detect
      changed_when: false

    - name: Backup ip6tables SEGMENTRA chains
      when: iptables_will_apply and ip6_tools_detect.stdout == 'yes'
      become: true
      script: "files/segmentra-iptables.sh backup ip6tables {{ segmentra_backup_dir }}/ip6tables.{{ segmentra_ts }}"
      changed_when: true

    - name: Preserve legacy (full-table design) policy files for cleanup
      when: iptables_will_apply
      become: true
      shell: |
        if [ -f /etc/segmentra.policy ] && grep -Eq '^-A (INPUT|OUTPUT) ' /etc/segmentra.policy; then cp -p /etc/segmentra.policy {{ segmentra_legacy_policy }}; fi
        if [ -f /etc/segmentra.policy6 ] && grep -Eq '^-A (INPUT|OUTPUT) ' /etc/segmentra.policy6; then cp -p /etc/segmentra.policy6 {{ segmentra_legacy_policy6 }}; fi
      changed_when: false

    - name: Copy policy file to host
      become: true
      copy:
        src: "{{ seg_policy_file }}"
        dest: "/etc/segmentra.policy"
        mode: "0600"

    - name: Copy IPv6 policy file to host
      when: ip6_will_apply
      become: true
      copy:
        src: "{{ seg_ip6_policy_file }}"
        dest: "/etc/segmentra.policy6"
        mode: "0600"

    - name: Remove stale IPv6 policy file
      when: iptables_will_apply and not ip6_will_apply
      become: true
      file:
        path: "/etc/segmentra.policy6"
        state: absent

    # Lockout protection (same dead-man pattern as run-ssh.ts / apply-manager.yml): install the host
    # scripts so the revert is self-contained, arm an unattended revert of this run's backup before the
    # apply, verify a FRESH SSH connection through the new rules, and only then cancel the revert and
    # persist the new state for reboots.
    - name: Install host script copies for the unattended revert
      become: true
      copy:
        src: "files/{{ item }}"
        dest: "{{ segmentra_backup_dir }}/{{ item }}"
        mode: "0700"
      loop: [segmentra-nft.sh, segmentra-iptables.sh]

    - name: Define the unattended revert command
      set_fact:
        seg_revert_cmd: >-
          {% set d = segmentra_backup_dir %}touch {{ seg_revert_marker | quote }};
          {% if nft_will_apply %}rc=0; /bin/sh {{ (d ~ '/segmentra-nft.sh') | quote }} restore {{ (d ~ '/nft.ruleset.' ~ segmentra_ts) | quote }} || rc=$?;
          /bin/sh {{ (d ~ '/segmentra-nft.sh') | quote }} persist || :;
          {% else %}rc=0; /bin/sh {{ (d ~ '/segmentra-iptables.sh') | quote }} restore iptables {{ (d ~ '/iptables.' ~ segmentra_ts) | quote }} || rc=$?;
          if [ -s {{ (d ~ '/ip6tables.' ~ segmentra_ts) | quote }} ] && command -v ip6tables-restore >/dev/null 2>&1; then
          /bin/sh {{ (d ~ '/segmentra-iptables.sh') | quote }} restore ip6tables {{ (d ~ '/ip6tables.' ~ segmentra_ts) | quote }} || rc=$?; fi;
          /bin/sh {{ (d ~ '/segmentra-iptables.sh') | quote }} persist iptables || :;
          if command -v ip6tables-save >/dev/null 2>&1; then /bin/sh {{ (d ~ '/segmentra-iptables.sh') | quote }} persist ip6tables || :; fi;
          {% endif %}echo "$rc" > {{ (seg_revert_marker ~ '.rc') | quote }}; exit $rc

- name: Segmentra apply firewall rules (lockout-protected apply, in batches)
  hosts: all
  gather_facts: false
  any_errors_fatal: false
  # Batches of `forks` hosts: each host's arm -> apply -> verify -> cancel sequence takes a few task rounds,
  # independent of the fleet size (see the comment at the top). Override with SEGMENTRA_ANSIBLE_SERIAL.
  serial: "{{ lookup('env', 'SEGMENTRA_ANSIBLE_SERIAL') | default(ansible_forks | default(5), true) | int }}"
  vars: *segmentra_vars
  tasks:
    - name: Deploy through the native firewall manager
      include_tasks: apply-manager.yml
      when: (segmentra_backend | default('')) in ['firewalld', 'ufw']

    # The revert lives in a file: systemd 252 (RHEL 9, Debian 12) corrupts an inline "sh -c" command when its transient
    # unit is re-read, and any daemon-reload before the timer fires does that.
    - name: Write the unattended revert script
      become: true
      copy:
        dest: "{{ seg_revert_marker }}.sh"
        mode: "0700"
        content: "{{ seg_revert_cmd }}\n"

    - name: Schedule the unattended revert before changing the firewall
      become: true
      shell: |
        PATH="$PATH:/usr/sbin:/sbin"
        if command -v systemd-run >/dev/null 2>&1 && [ -d /run/systemd/system ] &&
           systemd-run --quiet --unit={{ seg_revert_unit | quote }} --on-active={{ seg_revert_delay }} --timer-property=AccuracySec=1s /bin/sh {{ (seg_revert_marker ~ '.sh') | quote }} >/dev/null 2>&1; then
          echo "systemd:{{ seg_revert_unit }}"
        else
          nohup sh -c {{ ('sleep ' ~ seg_revert_delay ~ '; /bin/sh ' ~ ((seg_revert_marker ~ '.sh') | quote)) | quote }} >/dev/null 2>&1 </dev/null &
          echo "pid:$!"
        fi
      register: seg_revert_sched
      failed_when: false

    - name: Record that the unattended revert could not be scheduled (nothing was changed)
      when: (seg_revert_sched.rc | default(1)) != 0 or not ((seg_revert_sched.stdout_lines | default([]) | last | default('')) is match('^(systemd:[A-Za-z0-9-]+|pid:[0-9]+)$'))
      set_fact:
        seg_apply_failed_msg: "Could not schedule the unattended revert (lockout protection); deployment aborted, no changes made: {{ seg_revert_sched.stderr | default(seg_revert_sched.msg | default('')) }}"

    - name: Stop here when the unattended revert could not be scheduled
      when: seg_apply_failed_msg is defined
      meta: end_host

    # Exit 0 = cancelled before it fired; 9 = it fired or is firing (never stopped half-way); else = failed.
    # Stopping the .timer does not stop a .service it already started, so that is checked too.
    # Status: pending | running | done (fired, restore succeeded) | failed (fired, restore failed: non-zero
    # <marker>.rc, or the transient .service failed / Result != success) | gone (neither scheduled nor fired).
    - name: Define the revert cancel and status scripts
      vars:
        tok: "{{ seg_revert_sched.stdout_lines | last }}"
        m: "{{ seg_revert_marker | quote }}"
        mrc: "{{ (seg_revert_marker ~ '.rc') | quote }}"
        svc: "{{ (seg_revert_unit ~ '.service') | quote }}"
        tmr: "{{ (seg_revert_unit ~ '.timer') | quote }}"
      set_fact:
        seg_revert_cancel_sh: |-
          {% if tok.startswith('systemd:') %}
          if [ -e {{ m }} ]; then exit 9; fi
          if ! systemctl stop {{ tmr }}; then if [ -e {{ m }} ]; then exit 9; fi; exit 1; fi
          case "$(systemctl is-active {{ svc }} 2>/dev/null)" in active|activating|deactivating|reloading|refreshing) exit 9 ;; esac
          if [ -e {{ m }} ]; then exit 9; fi
          systemctl reset-failed {{ tmr }} {{ svc }} >/dev/null 2>&1
          exit 0
          {% else %}
          pid={{ tok[4:] }}
          if [ -e {{ m }} ] || ! kill -0 "$pid" 2>/dev/null; then exit 9; fi
          kill "$pid" 2>/dev/null
          sleep 1
          if kill -0 "$pid" 2>/dev/null; then exit 1; fi
          if [ -e {{ m }} ]; then exit 9; fi
          exit 0
          {% endif %}
        seg_revert_status_sh: |-
          {% if tok.startswith('systemd:') %}
          case "$(systemctl is-active {{ svc }} 2>/dev/null)" in active|activating|deactivating|reloading|refreshing) echo running; exit 0 ;; esac
          if [ -e {{ m }} ]; then
            seg_res=$(systemctl show -p Result {{ svc }} 2>/dev/null | sed -n 's/^Result=//p')
            seg_rrc=$(cat {{ mrc }} 2>/dev/null)
            if [ "${seg_rrc:-0}" = 0 ] && [ "$(systemctl is-active {{ svc }} 2>/dev/null)" != failed ] && { [ -z "$seg_res" ] || [ "$seg_res" = success ]; }; then echo done; else echo failed; fi
          elif systemctl is-active --quiet {{ tmr }} 2>/dev/null; then echo pending
          else echo gone; fi
          {% else %}
          pid={{ tok[4:] }}
          if kill -0 "$pid" 2>/dev/null; then if [ -e {{ m }} ]; then echo running; else echo pending; fi
          elif [ -e {{ m }} ]; then seg_rrc=$(cat {{ mrc }} 2>/dev/null); if [ "${seg_rrc:-0}" = 0 ]; then echo done; else echo failed; fi
          else echo gone; fi
          {% endif %}

    - name: Apply firewall rules with lockout protection and rollback on failure
      block:
        - name: Apply nftables ruleset (replaces only table inet segmentra)
          when: nft_will_apply
          become: true
          shell: "nft -f /etc/segmentra.policy"

        - name: Apply iptables chains SEGMENTRA-IN/OUT(/FWD) and INPUT/OUTPUT(/FORWARD) jumps
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh apply iptables /etc/segmentra.policy {{ segmentra_legacy_policy }}"
          register: ipt_apply

        - name: Show iptables apply output
          when: iptables_will_apply
          debug:
            var: ipt_apply.stdout_lines

        - name: Check for ip6tables-restore
          when: ip6_will_apply
          become: true
          shell: "command -v ip6tables-restore >/dev/null 2>&1 && echo yes || echo no"
          register: ip6_detect
          changed_when: false

        - name: Apply ip6tables chains SEGMENTRA-IN/OUT(/FWD) and INPUT/OUTPUT(/FORWARD) jumps
          when: ip6_will_apply and ip6_detect.stdout == 'yes'
          become: true
          script: "files/segmentra-iptables.sh apply ip6tables /etc/segmentra.policy6 {{ segmentra_legacy_policy6 }}"
          register: ip6_apply

        - name: Show ip6tables apply output
          when: ip6_will_apply and ip6_detect.stdout == 'yes'
          debug:
            var: ip6_apply.stdout_lines

        - name: Warn when IPv6 rules could not be applied
          when: ip6_will_apply and ip6_detect.stdout != 'yes'
          debug:
            msg: "warning: ip6tables-restore not found; IPv6 rules not applied"

        - name: Close the pre-apply SSH connection
          meta: reset_connection

        # Must finish well before the revert fires (a probe that succeeds only because the revert
        # restored access is caught by the cancel below: the marker exists, exit 9).
        - name: Verify a fresh SSH connection through the new policy
          wait_for_connection:
            timeout: "{{ [10, [30, (seg_revert_delay | int) - 40] | min] | max }}"
            connect_timeout: 5

        - name: Cancel the unattended revert only if it has not fired
          become: true
          shell: "{{ seg_revert_cancel_sh }}"
          register: seg_revert_cancel
          retries: 2
          delay: 1
          until: seg_revert_cancel.rc in [0, 9]
          changed_when: true

        - name: Retire legacy policy files (migration done)
          when: iptables_will_apply
          become: true
          shell: |
            if [ -f {{ segmentra_legacy_policy }} ]; then mv -f {{ segmentra_legacy_policy }} {{ segmentra_legacy_policy }}.migrated; fi
            if [ -f {{ segmentra_legacy_policy6 }} ]; then mv -f {{ segmentra_legacy_policy6 }} {{ segmentra_legacy_policy6 }}.migrated; fi
          changed_when: false

        # Reboot persistence with the distribution's OWN service (no Segmentra code runs at boot):
        # nftables: /etc/nftables.d/segmentra.nft (Debian/Ubuntu) or /etc/nftables/segmentra.nft
        # (RHEL family) + one include line in the distro's nftables config, nftables.service
        # enabled (never started). iptables: SEGMENTRA lines merged into /etc/iptables/rules.v4|v6
        # (iptables-persistent) or /etc/sysconfig/iptables|ip6tables (iptables-services), the
        # service enabled. Packages are never installed and firewalld is never disabled; missing
        # pieces are reported as SEGMENTRA_PERSIST_WARN lines and never fail the play.
        - name: Persist table inet segmentra for reboots (distribution nftables.service)
          when: nft_will_apply
          become: true
          script: "files/segmentra-nft.sh persist"
          register: nft_persist
          failed_when: false
          changed_when: true

        - name: Persist iptables SEGMENTRA chains for reboots (iptables-persistent / iptables-services)
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh persist iptables"
          register: ipt_persist
          failed_when: false
          changed_when: true

        - name: Persist ip6tables SEGMENTRA chains for reboots
          when: iptables_will_apply and ip6_tools_detect.stdout == 'yes'
          become: true
          script: "files/segmentra-iptables.sh persist ip6tables"
          register: ip6_persist
          failed_when: false
          changed_when: true

        - name: Show reboot persistence result
          debug:
            msg: "{{ ([nft_persist, ipt_persist, ip6_persist] | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten) | select('match', '^SEGMENTRA_PERSIST') | list }}"
      rescue:
        # The host lock is held for the whole run: never finish while the revert is still armed or
        # running, or a retry right after this run would be rolled back by it.
        # Rescue tasks never fail the host (ignore_unreachable / failed_when: false): in serial mode a batch
        # whose hosts all fail would end the playbook. The outcome is recorded below and reported by play 3.
        - name: Wait until the host answers again (the unattended revert restores access when it fires)
          wait_for_connection:
            timeout: "{{ (seg_revert_delay | int) + 120 }}"
            connect_timeout: 5
          ignore_errors: true

        - name: Cancel the unattended revert before the immediate rollback
          when: (seg_revert_cancel.rc | default(-1)) != 0
          become: true
          ignore_unreachable: true
          shell: "{{ seg_revert_cancel_sh }}"
          register: seg_rescue_cancel
          failed_when: false
          changed_when: true

        - name: Decide who restores the previous state
          set_fact:
            seg_revert_cancelled: "{{ (seg_revert_cancel.rc | default(-1)) == 0 or (seg_rescue_cancel.rc | default(-1)) == 0 }}"

        - name: Wait for the unattended revert to finish (it restores this run's backup)
          when: not seg_revert_cancelled
          become: true
          ignore_unreachable: true
          shell: "{{ seg_revert_status_sh }}"
          register: seg_revert_state
          until: seg_revert_state.stdout | default('') in ['done', 'failed', 'gone']
          retries: "{{ ((seg_revert_delay | int) + 120) // 5 }}"
          delay: 5
          failed_when: false
          changed_when: false

        # Scoped rollback: only table inet segmentra / SEGMENTRA-IN/OUT(/FWD) + jumps are
        # restored (legacy full-table iptables hosts: the filter table). Failures are
        # recorded and reported by the final task instead of aborting the rescue. Skipped when
        # the unattended revert fired (it restored the same backup and re-synced persistence).
        - name: Roll back table inet segmentra from this run's backup
          when: nft_will_apply and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-nft.sh restore {{ segmentra_backup_dir }}/nft.ruleset.{{ segmentra_ts }}"
          register: nft_rollback
          failed_when: false
          changed_when: true

        - name: Roll back iptables SEGMENTRA chains from this run's backup
          when: iptables_will_apply and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-iptables.sh restore iptables {{ segmentra_backup_dir }}/iptables.{{ segmentra_ts }}"
          register: ipt_rollback
          failed_when: false
          changed_when: true

        - name: Roll back ip6tables SEGMENTRA chains from this run's backup
          when: iptables_will_apply and (ip6_tools_detect.stdout | default('no')) == 'yes' and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-iptables.sh restore ip6tables {{ segmentra_backup_dir }}/ip6tables.{{ segmentra_ts }}"
          register: ip6_rollback
          failed_when: false
          changed_when: true

        # The boot configuration follows the restored state (persist syncs it to the live state).
        - name: Re-sync reboot persistence after the rollback (nftables)
          when: nft_will_apply and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-nft.sh persist"
          failed_when: false
          changed_when: true

        - name: Re-sync reboot persistence after the rollback (iptables)
          when: iptables_will_apply and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-iptables.sh persist iptables"
          failed_when: false
          changed_when: true

        - name: Re-sync reboot persistence after the rollback (ip6tables)
          when: iptables_will_apply and (ip6_tools_detect.stdout | default('no')) == 'yes' and seg_revert_cancelled
          become: true
          ignore_unreachable: true
          script: "files/segmentra-iptables.sh persist ip6tables"
          failed_when: false
          changed_when: true

        - name: Record the failure (reported by the last play)
          vars:
            rollback_results: "{{ [nft_rollback, ipt_rollback, ip6_rollback] | rejectattr('skipped', 'defined') | list }}"
            rollback_rcs: "{{ rollback_results | selectattr('rc', 'defined') | map(attribute='rc') | list }}"
            rollback_unreachable: "{{ rollback_results | selectattr('unreachable', 'defined') | selectattr('unreachable') | list | length > 0 }}"
            rollback_ok: "{{ not rollback_unreachable and (rollback_rcs | reject('equalto', 0) | list | length == 0) }}"
            revert_state: "{{ seg_revert_state.stdout | default('unknown', true) }}"
          set_fact:
            seg_apply_failed_msg: >-
              {% if seg_revert_cancelled %}Firewall apply or verification failed; rollback {{ 'succeeded (previous Segmentra state restored)' if rollback_ok
              else 'FAILED (host unreachable) - check the host manually' if rollback_unreachable
              else 'FAILED (exit codes ' ~ (rollback_rcs | join(', ')) ~ ') - check the host manually' }}{% else %}Firewall apply or verification
              failed; the unattended revert {{ 'fired and finished (previous Segmentra state restored)' if revert_state == 'done'
              else 'FAILED (it fired, but restoring the backup of this run did not succeed); host state unknown - check the host manually before deploying again' if revert_state == 'failed'
              else 'is no longer scheduled and did not fire - check the host manually' if revert_state == 'gone'
              else 'did not settle (state: ' ~ revert_state ~ ') - check the host before deploying again' }}{% endif %}

- name: Segmentra apply firewall rules (report)
  hosts: all
  gather_facts: false
  any_errors_fatal: false
  vars: *segmentra_vars
  tasks:
    - name: Fail after rollback
      when: seg_apply_failed_msg is defined
      fail:
        msg: "{{ seg_apply_failed_msg }}"

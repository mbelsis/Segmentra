- name: Segmentra apply firewall rules
  hosts: all
  gather_facts: false
  any_errors_fatal: false
  vars:
    segmentra_backup_dir: "/var/backups/segmentra"
    # Inputs (inventory host vars, or environment as fallback). Play vars must not redefine
    # them (play vars take precedence over inventory vars, and a self-reference recurses):
    #   segmentra_policy_file      compiled policy (.nft or .iptables)
    #   segmentra_ip6_policy_file  optional, iptables backend: ip6tables-restore --noflush fragment
    #                              (CompileOutput.ip6tablesRules)
    seg_policy_file: "{{ segmentra_policy_file | default(lookup('env', 'SEGMENTRA_POLICY_FILE'), true) | default('', true) }}"
    seg_ip6_policy_file: "{{ segmentra_ip6_policy_file | default(lookup('env', 'SEGMENTRA_IP6_POLICY_FILE'), true) | default('', true) }}"
    segmentra_legacy_policy: "/etc/segmentra.legacy.policy"
    segmentra_legacy_policy6: "/etc/segmentra.legacy.policy6"

  # Segmentra only ever touches its own state:
  #   nftables: table inet segmentra (replaced atomically by nft -f)
  #   iptables: chains SEGMENTRA-IN / SEGMENTRA-OUT plus one jump from INPUT / OUTPUT, and on
  #             gateways filtering forwarded traffic SEGMENTRA-FWD plus one jump from FORWARD
  #             (iptables-restore --noflush; see files/segmentra-iptables.sh)
  # Docker, Kubernetes, fail2ban, ... rules and built-in chain policies are left alone.
  # Backups and the failure rollback are scoped to exactly that state as well
  # (files/segmentra-nft.sh, files/segmentra-iptables.sh "backup" / "restore"): a full
  # `nft list ruleset` cannot be replayed on hosts where other tools use iptables-nft
  # (xtables-compat expressions), and replaying it would clobber their tables anyway.

  tasks:
    - name: Generate timestamp
      set_fact:
        segmentra_ts: "{{ lookup('pipe', 'date +%Y-%m-%dT%H-%M-%S') }}"

    - name: Fail if policy file not provided
      fail:
        msg: "SEGMENTRA_POLICY_FILE is required"
      when: seg_policy_file == ""

    - name: Ensure backup directory exists
      become: true
      file:
        path: "{{ segmentra_backup_dir }}"
        state: directory
        mode: "0700"

    # Both tools may be installed (iptables-nft ships next to nft on modern distros), so only
    # check that the tool required by the compiled policy exists.
    - name: Detect nftables
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v nft >/dev/null 2>&1 && echo nft || echo no"
      register: nft_detect
      changed_when: false

    - name: Detect iptables-restore
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v iptables-restore >/dev/null 2>&1 && echo iptables || echo no"
      register: ipt_detect
      changed_when: false

    - name: Decide backend
      set_fact:
        nft_will_apply: "{{ nft_detect.stdout == 'nft' and seg_policy_file.endswith('.nft') }}"
        iptables_will_apply: "{{ ipt_detect.stdout == 'iptables' and seg_policy_file.endswith('.iptables') }}"
        ip6_will_apply: "{{ ipt_detect.stdout == 'iptables' and seg_policy_file.endswith('.iptables') and seg_ip6_policy_file != '' }}"

    - name: Log backend detection vs policy file
      debug:
        msg: "Backend detection: nft={{ nft_detect.stdout }} iptables-restore={{ ipt_detect.stdout }}, Policy file: {{ seg_policy_file }}, IPv6 policy file: {{ seg_ip6_policy_file | default('', true) }}, Will apply nftables: {{ nft_will_apply }}, Will apply iptables: {{ iptables_will_apply }}"

    - name: Fail if backend mismatch detected (no apply task will run)
      fail:
        msg: "The tool required by the policy is not installed on the host (policy file: {{ seg_policy_file }}; nft: {{ nft_detect.stdout }}, iptables-restore: {{ ipt_detect.stdout }}). Install it or change the host's firewall_backend setting."
      when: not nft_will_apply and not iptables_will_apply

    - name: Backup nftables.conf
      when: nft_will_apply
      become: true
      shell: |
        umask 077
        if [ -f /etc/nftables.conf ]; then
          cp /etc/nftables.conf "{{ segmentra_backup_dir }}/nftables.conf.{{ segmentra_ts }}"
        fi
      changed_when: true

    # Scoped backup: table inet segmentra only ("absent" marker if it does not exist).
    - name: Backup table inet segmentra
      when: nft_will_apply
      become: true
      script: "files/segmentra-nft.sh backup {{ segmentra_backup_dir }}/nft.ruleset.{{ segmentra_ts }}"
      changed_when: true

    # Scoped backup: SEGMENTRA-IN/OUT(/FWD) + INPUT/OUTPUT(/FORWARD) jumps (+ legacy-host flag);
    # the full iptables-save is kept next to it as <file>.full.
    - name: Backup iptables SEGMENTRA chains
      when: iptables_will_apply
      become: true
      script: "files/segmentra-iptables.sh backup iptables {{ segmentra_backup_dir }}/iptables.{{ segmentra_ts }}"
      changed_when: true

    - name: Detect ip6tables-save / ip6tables-restore
      when: iptables_will_apply
      become: true
      shell: "PATH=\"$PATH:/usr/sbin:/sbin\"; command -v ip6tables-save >/dev/null 2>&1 && command -v ip6tables-restore >/dev/null 2>&1 && echo yes || echo no"
      register: ip6_tools_detect
      changed_when: false

    - name: Backup ip6tables SEGMENTRA chains
      when: iptables_will_apply and ip6_tools_detect.stdout == 'yes'
      become: true
      script: "files/segmentra-iptables.sh backup ip6tables {{ segmentra_backup_dir }}/ip6tables.{{ segmentra_ts }}"
      changed_when: true

    - name: Preserve legacy (full-table design) policy files for cleanup
      when: iptables_will_apply
      become: true
      shell: |
        if [ -f /etc/segmentra.policy ] && grep -Eq '^-A (INPUT|OUTPUT) ' /etc/segmentra.policy; then cp -p /etc/segmentra.policy {{ segmentra_legacy_policy }}; fi
        if [ -f /etc/segmentra.policy6 ] && grep -Eq '^-A (INPUT|OUTPUT) ' /etc/segmentra.policy6; then cp -p /etc/segmentra.policy6 {{ segmentra_legacy_policy6 }}; fi
      changed_when: false

    - name: Copy policy file to host
      become: true
      copy:
        src: "{{ seg_policy_file }}"
        dest: "/etc/segmentra.policy"
        mode: "0600"

    - name: Copy IPv6 policy file to host
      when: ip6_will_apply
      become: true
      copy:
        src: "{{ seg_ip6_policy_file }}"
        dest: "/etc/segmentra.policy6"
        mode: "0600"

    - name: Remove stale IPv6 policy file
      when: iptables_will_apply and not ip6_will_apply
      become: true
      file:
        path: "/etc/segmentra.policy6"
        state: absent

    - name: Apply firewall rules with rollback on failure
      block:
        - name: Apply nftables ruleset (replaces only table inet segmentra)
          when: nft_will_apply
          become: true
          shell: "nft -f /etc/segmentra.policy"

        - name: Apply iptables chains SEGMENTRA-IN/OUT(/FWD) and INPUT/OUTPUT(/FORWARD) jumps
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh apply iptables /etc/segmentra.policy {{ segmentra_legacy_policy }}"
          register: ipt_apply

        - name: Show iptables apply output
          when: iptables_will_apply
          debug:
            var: ipt_apply.stdout_lines

        - name: Check for ip6tables-restore
          when: ip6_will_apply
          become: true
          shell: "command -v ip6tables-restore >/dev/null 2>&1 && echo yes || echo no"
          register: ip6_detect
          changed_when: false

        - name: Apply ip6tables chains SEGMENTRA-IN/OUT(/FWD) and INPUT/OUTPUT(/FORWARD) jumps
          when: ip6_will_apply and ip6_detect.stdout == 'yes'
          become: true
          script: "files/segmentra-iptables.sh apply ip6tables /etc/segmentra.policy6 {{ segmentra_legacy_policy6 }}"
          register: ip6_apply

        - name: Show ip6tables apply output
          when: ip6_will_apply and ip6_detect.stdout == 'yes'
          debug:
            var: ip6_apply.stdout_lines

        - name: Warn when IPv6 rules could not be applied
          when: ip6_will_apply and ip6_detect.stdout != 'yes'
          debug:
            msg: "warning: ip6tables-restore not found; IPv6 rules not applied"

        - name: Retire legacy policy files (migration done)
          when: iptables_will_apply
          become: true
          shell: |
            if [ -f {{ segmentra_legacy_policy }} ]; then mv -f {{ segmentra_legacy_policy }} {{ segmentra_legacy_policy }}.migrated; fi
            if [ -f {{ segmentra_legacy_policy6 }} ]; then mv -f {{ segmentra_legacy_policy6 }} {{ segmentra_legacy_policy6 }}.migrated; fi
          changed_when: false

        # Reboot persistence with the distribution's OWN service (no Segmentra code runs at boot):
        # nftables: /etc/nftables.d/segmentra.nft (Debian/Ubuntu) or /etc/nftables/segmentra.nft
        # (RHEL family) + one include line in the distro's nftables config, nftables.service
        # enabled (never started). iptables: SEGMENTRA lines merged into /etc/iptables/rules.v4|v6
        # (iptables-persistent) or /etc/sysconfig/iptables|ip6tables (iptables-services), the
        # service enabled. Packages are never installed and firewalld is never disabled; missing
        # pieces are reported as SEGMENTRA_PERSIST_WARN lines and never fail the play.
        - name: Persist table inet segmentra for reboots (distribution nftables.service)
          when: nft_will_apply
          become: true
          script: "files/segmentra-nft.sh persist"
          register: nft_persist
          failed_when: false
          changed_when: true

        - name: Persist iptables SEGMENTRA chains for reboots (iptables-persistent / iptables-services)
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh persist iptables"
          register: ipt_persist
          failed_when: false
          changed_when: true

        - name: Persist ip6tables SEGMENTRA chains for reboots
          when: iptables_will_apply and ip6_tools_detect.stdout == 'yes'
          become: true
          script: "files/segmentra-iptables.sh persist ip6tables"
          register: ip6_persist
          failed_when: false
          changed_when: true

        - name: Show reboot persistence result
          debug:
            msg: "{{ ([nft_persist, ipt_persist, ip6_persist] | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten) | select('match', '^SEGMENTRA_PERSIST') | list }}"
      rescue:
        # Scoped rollback: only table inet segmentra / SEGMENTRA-IN/OUT(/FWD) + jumps are
        # restored (legacy full-table iptables hosts: the filter table). Failures are
        # recorded and reported by the final task instead of aborting the rescue.
        - name: Roll back table inet segmentra from this run's backup
          when: nft_will_apply
          become: true
          script: "files/segmentra-nft.sh restore {{ segmentra_backup_dir }}/nft.ruleset.{{ segmentra_ts }}"
          register: nft_rollback
          failed_when: false
          changed_when: true

        - name: Roll back iptables SEGMENTRA chains from this run's backup
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh restore iptables {{ segmentra_backup_dir }}/iptables.{{ segmentra_ts }}"
          register: ipt_rollback
          failed_when: false
          changed_when: true

        - name: Roll back ip6tables SEGMENTRA chains from this run's backup
          when: iptables_will_apply and (ip6_tools_detect.stdout | default('no')) == 'yes'
          become: true
          script: "files/segmentra-iptables.sh restore ip6tables {{ segmentra_backup_dir }}/ip6tables.{{ segmentra_ts }}"
          register: ip6_rollback
          failed_when: false
          changed_when: true

        # The boot configuration follows the restored state (persist syncs it to the live state).
        - name: Re-sync reboot persistence after the rollback (nftables)
          when: nft_will_apply
          become: true
          script: "files/segmentra-nft.sh persist"
          failed_when: false
          changed_when: true

        - name: Re-sync reboot persistence after the rollback (iptables)
          when: iptables_will_apply
          become: true
          script: "files/segmentra-iptables.sh persist iptables"
          failed_when: false
          changed_when: true

        - name: Re-sync reboot persistence after the rollback (ip6tables)
          when: iptables_will_apply and (ip6_tools_detect.stdout | default('no')) == 'yes'
          become: true
          script: "files/segmentra-iptables.sh persist ip6tables"
          failed_when: false
          changed_when: true

        - name: Fail after rollback
          vars:
            rollback_rcs: "{{ [nft_rollback, ipt_rollback, ip6_rollback] | selectattr('rc', 'defined') | map(attribute='rc') | list }}"
            rollback_ok: "{{ rollback_rcs | reject('equalto', 0) | list | length == 0 }}"
          fail:
            msg: >-
              Firewall apply failed; rollback {{ 'succeeded (previous Segmentra state restored)' if rollback_ok
              else 'FAILED (exit codes ' ~ (rollback_rcs | join(', ')) ~ ') - check the host manually' }}

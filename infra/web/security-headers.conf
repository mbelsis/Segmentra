# Security headers for the Segmentra UI (included in every location of nginx.conf that
# serves static files: an add_header inside a location replaces all inherited ones).
# "always" so they are also sent on 4xx/5xx responses.
#
# CSP notes (checked against the Vite build in apps/web/dist):
#   - script-src 'self': the build has no inline scripts and no eval.
#   - style-src 'unsafe-inline': React style props, recharts, and the compliance report
#     opened as a blob: URL (which inherits this policy) use inline styles. No scripts.
#   - Google Fonts (index.html) need fonts.googleapis.com (CSS) and fonts.gstatic.com (fonts).
#   - img-src data:/blob: for inline SVG icons in the CSS and generated downloads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

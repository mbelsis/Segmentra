server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Plain HTTP: the login password and the JWT (Authorization header) cross the network
    # in clear text. Terminate TLS in front of this container (see docs/installation.md,
    # "TLS / reverse proxy") or bind WEB_BIND=127.0.0.1 and put a TLS proxy on the host.

    # Resolve the API container through Docker's embedded DNS at request time (cached 10s),
    # so recreating segmentra-app (new IP) needs no nginx restart, and nginx also starts
    # while the API container does not exist yet (requests get 502 until it is up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $segmentra_api http://segmentra-app:8080;

    # API proxy — forward /api requests to the backend container.
    # ^~ stops the static-asset regex below from capturing API paths ending in .js/.png etc.
    location ^~ /api/ {
        # proxy_pass with a variable and no URI part: the request URI is passed to the API
        # unchanged (/api/... -> /api/...), exactly as the former static
        # "proxy_pass http://segmentra-app:8080/api/" mapped it.
        proxy_pass $segmentra_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backup / policy-as-code imports (the API accepts up to 25 MB).
        client_max_body_size 25m;
        # Deployments / audits can run for several minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # API responses are JSON (or HTML reports the API serves with its own CSP), so no
        # SPA CSP here - two CSP headers would both be enforced.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # index.html must be revalidated so a new build's hashed assets are picked up.
    location = /index.html {
        include /etc/nginx/segmentra/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        include /etc/nginx/segmentra/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/segmentra/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Unattended RHEL 9 test VM for tests/expiry-lab/vm. Nothing about registration is here: the installer waits for a person
# to click "Connect to Red Hat" and log in. Test-only: a generated SSH key, and no root or user password.
graphical
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc
rootpw --lock
user --name=segmentra --lock
selinux --enforcing
firewall --enabled --ssh --port=22104:tcp
network --bootproto=dhcp --device=link --activate --hostname=seg-rhel
zerombr
clearpart --all --initlabel
autopart
reboot
%packages
@^minimal-environment
firewalld
iptables-services
nftables
python3
policycoreutils-python-utils
sudo
openssh-server
%end
%post --log=/root/seg-post.log
set -x
usermod -p '*' segmentra
printf 'segmentra ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/segmentra
chmod 440 /etc/sudoers.d/segmentra
install -d -m 700 -o segmentra -g segmentra /home/segmentra/.ssh
echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM8oyBcOSCiMtmGx4W+dBXQ6opmU2rw2MgWCS4DLClPX segmentra-expiry-rhel' > /home/segmentra/.ssh/authorized_keys
chown segmentra:segmentra /home/segmentra/.ssh/authorized_keys
chmod 600 /home/segmentra/.ssh/authorized_keys
restorecon -R /home/segmentra/.ssh
semanage port -a -t ssh_port_t -p tcp 22104 || semanage port -m -t ssh_port_t -p tcp 22104
printf 'Port 22\nPort 22104\n' > /etc/ssh/sshd_config.d/10-segmentra-test.conf
nmcli -v >/dev/null
cat > /etc/NetworkManager/system-connections/segmentra-lab.nmconnection <<'NM'
[connection]
id=segmentra-lab
type=ethernet
interface-name=enp0s9
[ipv4]
method=manual
addresses=192.168.77.14/24
[ipv6]
method=disabled
NM
chmod 600 /etc/NetworkManager/system-connections/segmentra-lab.nmconnection
cat > /usr/local/bin/seg-listen.py <<'PY'
#!/usr/bin/env python3
import socket, threading
def serve(port):
    s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('0.0.0.0', port)); s.listen(16)
    while True:
        c, _ = s.accept(); c.close()
for p in (8081, 8082, 8083):
    threading.Thread(target=serve, args=(p,), daemon=True).start()
threading.Event().wait()
PY
cat > /etc/systemd/system/seg-listen.service <<'UNIT'
[Unit]
Description=Test TCP listeners
After=network.target
[Service]
ExecStart=/usr/bin/python3 /usr/local/bin/seg-listen.py
Restart=always
[Install]
WantedBy=multi-user.target
UNIT
systemctl enable seg-listen
%end

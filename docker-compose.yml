services:
  segmentra-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-segmentra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-segmentra}
      POSTGRES_DB: ${DB_NAME:-segmentra}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - segmentra_pgdata:/var/lib/postgresql/data

  segmentra-ansible-runner:
    build:
      context: ./infra/ansible-runner
    volumes:
      - segmentra_bundles:/bundles
    command: ["sleep", "infinity"]

  segmentra-app:
    build:
      context: .
      dockerfile: ./infra/app/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://segmentra:segmentra@segmentra-db:5432/segmentra}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SEGMENTRA_KEK_B64: ${SEGMENTRA_KEK_B64:-}
      BUNDLES_DIR: /bundles
      ANSIBLE_RUNNER_CONTAINER: segmentra-ansible-runner
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - segmentra-db
    volumes:
      - segmentra_bundles:/bundles
      - /var/run/docker.sock:/var/run/docker.sock

  segmentra-web:
    build:
      context: .
      dockerfile: ./infra/web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - segmentra-app

volumes:
  segmentra_pgdata:
  segmentra_bundles:
